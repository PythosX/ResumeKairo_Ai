<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResumeKairo — Builder</title><link rel="stylesheet" href="/static/css/main.css"><link rel="stylesheet" href="/static/css/builder.css"><link rel="stylesheet" href="/static/css/templates.css"></head>
<body><header><a class="brand" href="/">ResumeKairo</a><div><button id="theme" class="btn ghost">◐</button><a class="btn primary" href="/analysis" id="analyze">Analyze →</a></div></header>
<main class="builder"><section class="editor glass"><div class="section-title"><small>STEP 01</small><h1>Create your resume</h1><p>Choose a template and add your details. Your preview updates instantly.</p></div>
<div class="template-grid" id="templates"></div>
<form id="resumeForm">
<div class="form-section"><h2>Personal details</h2><div class="two"><label>Name<input id="name" required placeholder="Alex Morgan"></label><label>Professional title<input id="title" placeholder="Software Engineer"></label><label>Email<input id="email" type="email" placeholder="alex@email.com"></label><label>Phone<input id="phone" placeholder="+91 98765 43210"></label><label>Location<input id="location" placeholder="Mumbai, India"></label><label>LinkedIn / website<input id="website" placeholder="linkedin.com/in/alex"></label></div><label>Photo<input id="photo" type="file" accept="image/*"></label></div>
<div class="form-section"><h2>Summary</h2><textarea id="summary" rows="4" placeholder="A concise professional summary..."></textarea></div>
<div class="form-section"><h2>Skills</h2><input id="skills" placeholder="Python, JavaScript, React, SQL, Git"></div>
<div class="form-section"><h2>Experience</h2><div id="experience"></div><button type="button" class="btn ghost" id="addExp">+ Add experience</button></div>
<div class="form-section"><h2>Education</h2><div id="education"></div><button type="button" class="btn ghost" id="addEdu">+ Add education</button></div>
<div class="form-section"><h2>Achievements</h2><textarea id="achievements" rows="4" placeholder="One achievement per line"></textarea></div>
</form></section>
<section class="preview-wrap glass"><div class="preview-top"><span>LIVE A4 PREVIEW</span><button class="btn ghost" onclick="window.print()">Print / PDF</button></div><div id="preview" class="paper"></div></section></main>
<footer>Developed by <strong>PythosX</strong> · <a href="https://github.com/PythosX" target="_blank">GitHub ↗</a></footer>
<script src="/static/js/builder.js"></script></body></html>
